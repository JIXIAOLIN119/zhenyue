services:
  # --- ZhenYue Application Services ---
  postgres:
    image: pgvector/pgvector:pg18
    container_name: zhenyue_postgres
    environment:
      POSTGRES_USER: zhenyue
      POSTGRES_PASSWORD: zhenyue_password
      POSTGRES_DB: zhenyue_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zhenyue -d zhenyue_db']
      interval: 5s
      timeout: 5s
      retries: 5

  zhenyue:
    build:
      context: ../..
      dockerfile: Dockerfile.cn
    image: zhenyueone/zhenyue:latest
    container_name: zhenyue_app
    ports:
      - '3000:3000'
    volumes:
      - zhenyue_data:/app/data
    environment:
      DATABASE_URL: postgres://zhenyue:zhenyue_password@postgres:5432/zhenyue_db?search_path=public&sslmode=disable
      STORAGE_BACKEND: s3
      AWS_ENDPOINT_URL_S3: S3_ENDPOINT_URL
      S3_REGION: S3_REGION
      S3_BUCKET: BUCKET_NAME
      S3_ACCESS_KEY_ID: ID
      S3_SECRET_ACCESS_KEY: KEY
      BETTER_AUTH_SECRET: qSxs9DxzHDZBbeeTNPEwBuspYwipBqz5Gk5XdBjNhWw=
      WORKFLOW_EXECUTOR: temporal
      TEMPORAL_ADDRESS: temporal:7233
      GEMINI_API_KEY: KEY
      ENABLE_WEAKER_NESTED_SANDBOX: 'true'
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy

  # --- Temporal Services ---
  temporal:
    image: docker.m.daocloud.io/temporalio/auto-setup:latest
    container_name: temporal_server
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=zhenyue
      - POSTGRES_PWD=zhenyue_password
      - POSTGRES_SEEDS=postgres
      - BIND_ON_IP=0.0.0.0
    ports:
      - '7233:7233'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'temporal operator cluster health --address localhost:7233 || temporal operator cluster health --address $$(hostname -i):7233',
        ]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy

  temporal-ui:
    image: docker.m.daocloud.io/temporalio/ui:latest
    container_name: temporal_ui
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    ports:
      - '8080:8080'
    depends_on:
      temporal:
        condition: service_healthy

volumes:
  postgres_data:
  zhenyue_data:
